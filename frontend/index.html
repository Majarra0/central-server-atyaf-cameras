<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة المراقبة المركزية</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="top-bar">
    <span class="logo-text">لوحة المراقبة المركزية</span>
    <nav class="tabs">
      <button class="tab-btn active" data-tab="upload">رفع الصور</button>
      <button class="tab-btn"        data-tab="live">المراقبة المباشرة</button>
      <button class="tab-btn"        data-tab="events">سجل الأحداث</button>
    </nav>
  </header>

  <!-- ── UPLOAD TAB ─────────────────────────────────────────────────────── -->
  <div id="tab-upload" class="tab-pane active">
    <div class="card upload-card">
      <h2>رفع صورة موظف</h2>
      <p class="sub">ربط صورة الموظف بفرعه وإضافتها لمكتبة التعرف</p>

      <form id="uploadForm" enctype="multipart/form-data" novalidate>

        <div class="field">
          <label for="employee_id">رقم الموظف</label>
          <input type="text" id="employee_id" name="employee_id"
                 placeholder="مثال: HR-EMP-00001" autocomplete="off" required>
        </div>

        <div class="field">
          <label for="branch">الفرع</label>
          <select id="branch" name="branch" required>
            <option value="" disabled selected>اختر الفرع...</option>
          </select>
        </div>

        <div class="field">
          <label>الصورة</label>
          <label for="picture" class="file-drop" id="fileDrop">
            <svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" fill="none"
                 viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round"
                    d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021
                       18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5"/>
            </svg>
            <span id="fileName">اضغط لاختيار صورة</span>
            <span class="hint">PNG · JPG · WEBP — حتى 10 MB</span>
          </label>
          <input type="file" id="picture" name="picture" accept="image/*" required>
          <img id="preview" class="preview hidden" alt="معاينة">
        </div>

        <button type="submit" id="submitBtn">رفع الصورة</button>
      </form>

      <div id="uploadMsg" class="msg hidden"></div>
    </div>
  </div>

  <!-- ── LIVE TAB ───────────────────────────────────────────────────────── -->
  <div id="tab-live" class="tab-pane hidden">
    <div class="toolbar">
      <span class="toolbar-title">المراقبة المباشرة</span>
      <button class="btn-sm" id="refreshStatusBtn">تحديث الحالة</button>
    </div>
    <div id="liveGrid" class="live-grid">
      <div class="placeholder">جارٍ تحميل الفروع...</div>
    </div>
  </div>

  <!-- ── EVENTS TAB ─────────────────────────────────────────────────────── -->
  <div id="tab-events" class="tab-pane hidden">
    <div class="toolbar">
      <span class="toolbar-title">سجل الأحداث</span>
      <div class="filters">
        <select id="evtSite"><option value="">— اختر الفرع —</option></select>
        <select id="evtCamera"><option value="">جميع الكاميرات</option></select>
        <button class="btn-sm" id="loadEventsBtn">تحميل</button>
      </div>
    </div>
    <div id="eventsGrid" class="events-grid">
      <div class="placeholder">اختر فرعاً ثم اضغط تحميل</div>
    </div>
  </div>

  <!-- ── LIVE STREAM MODAL ─────────────────────────────────────────────── -->
  <div id="streamModal" class="modal-overlay hidden">
    <div class="modal-box stream-modal-box">
      <button class="modal-close" id="closeStreamModal">✕</button>
      <div class="modal-title" id="streamModalTitle"></div>
      <iframe id="streamFrame" src="" allowfullscreen
              allow="autoplay; camera; microphone"></iframe>
    </div>
  </div>

  <!-- ── SNAPSHOT MODAL ────────────────────────────────────────────────── -->
  <div id="snapModal" class="modal-overlay hidden">
    <div class="modal-box snap-modal-box">
      <button class="modal-close" id="closeSnapModal">✕</button>
      <img id="snapImg" src="" alt="لقطة الحدث">
      <div class="snap-meta" id="snapMeta"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
